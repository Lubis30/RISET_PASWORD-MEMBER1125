<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Straw Hat Reset — Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(ellipse 500px 400px at 50% 0%, rgba(251,191,36,0.16), transparent 70%),
      radial-gradient(ellipse 400px 320px at 100% 100%, rgba(220,38,38,0.18), transparent 70%),
      linear-gradient(180deg, rgba(8,10,22,0.75), rgba(6,8,18,0.95)),
      url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 16px;
    overflow-x: hidden;
    position: relative;
  }

  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .flake {
    position: absolute; top: -20px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.85);
    animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    0% { transform: translate3d(0,-20px,0); }
    100% { transform: translate3d(var(--drift), 105vh, 0); }
  }

  .card-frame {
    position: relative; z-index: 10; width: 100%; max-width: 420px;
    border-radius: 28px; padding: 1.5px;
    background: linear-gradient(135deg, rgba(251,191,36,0.8), rgba(252,211,77,0.5), rgba(220,38,38,0.7));
    background-size: 200% 200%;
    animation: borderShimmer 6s ease-in-out infinite;
    box-shadow: 0 30px 80px -15px rgba(0,0,0,0.85);
  }
  @keyframes borderShimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(0.9); }
    50% { opacity: 0.9; transform: scale(1.05); }
  }
  .card {
    position: relative; overflow: hidden; border-radius: 27px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(2,6,20,0.92);
    backdrop-filter: blur(24px);
    padding: 28px;
  }
  .sheen {
    position: absolute; right: -64px; top: -64px; width: 160px; height: 160px;
    border-radius: 50%; background: rgba(251,191,36,0.2); filter: blur(48px);
    pointer-events: none;
  }

  .theme-btn {
    position: absolute; right: 16px; top: 16px; width: 32px; height: 32px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05); color: #cbd5e1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s; font-size: 14px;
  }
  .theme-btn:hover { transform: scale(1.1); border-color: rgba(251,191,36,0.5); color: #fbbf24; }

  header { text-align: center; position: relative; }
  .logo-wrap {
    position: relative; margin: 0 auto; max-width: 300px;
    display: flex; align-items: center; justify-content: center; padding: 4px 0;
  }
  .logo-glow {
    position: absolute; inset: 0; margin: auto; width: 90%; height: 90%;
    border-radius: 999px; background: rgba(220,38,38,0.28); filter: blur(28px);
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  .logo-wrap img {
    position: relative; width: 100%; height: auto; object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(220,38,38,0.55));
  }
  h1 {
    margin: 16px 0 0; font-family: 'Cinzel', serif; font-weight: 800; font-size: 26px;
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, #fde68a, #fbbf24, #fde68a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
  .subtitle-row span.line { height: 1px; width: 32px; background: linear-gradient(90deg, transparent, rgba(251,191,36,0.6)); }
  .subtitle-row span.line.r { background: linear-gradient(270deg, transparent, rgba(251,191,36,0.6)); }
  .subtitle { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3em; color: rgba(253,230,138,0.7); }

  .field { margin-top: 16px; }
  label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; }
  input[type=text] {
    width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04); padding: 12px 16px; font-size: 14px; font-weight: 500;
    color: #f1f5f9; outline: none; transition: 0.2s;
  }
  input[type=text]::placeholder { color: #64748b; }
  input[type=text]:focus { border-color: rgba(251,191,36,0.7); background: rgba(255,255,255,0.06); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }

  .pw-wrap { position: relative; }
  .pw-display {
    min-height: 72px; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; border: 1px solid rgba(251,191,36,0.4);
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.05), transparent);
    padding: 16px 56px; text-align: center; font-size: 27px; font-weight: 900;
    letter-spacing: 0.12em; color: #fde68a;
    text-shadow: 0 2px 10px rgba(251,191,36,0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    transition: 0.2s;
  }
  .pw-display.empty { font-size: 14px; font-weight: 400; letter-spacing: normal; color: #64748b; text-shadow: none; }
  .copy-pw-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
    color: #cbd5e1; display: none; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.15s; font-size: 15px;
  }
  .copy-pw-btn.show { display: flex; }
  .copy-pw-btn:hover { border-color: rgba(251,191,36,0.6); background: rgba(251,191,36,0.1); color: #fbbf24; }
  .copy-pw-btn:active { transform: translateY(-50%) scale(0.9); }
  .copy-pw-btn.copied { border-color: rgba(16,185,129,0.6); background: rgba(16,185,129,0.15); color: #34d399; }

  textarea {
    margin-top: 16px; height: 150px; width: 100%; resize: none; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03);
    padding: 12px; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.6;
    color: #cbd5e1; outline: none; transition: 0.2s;
  }
  textarea::placeholder { color: #64748b; }
  textarea:focus { border-color: rgba(251,191,36,0.6); }

  .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  button.action {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px; padding: 13px 16px; font-size: 14px; font-weight: 700;
    color: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px -6px rgba(0,0,0,0.5);
  }
  button.action:hover { transform: translateY(-2px); }
  button.action:active { transform: scale(0.96); }
  .btn-roll { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .btn-copy { background: linear-gradient(135deg, #fbbf24, #d97706); color: #1c1917; }
  .btn-copy.done { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }

  .alert { margin-top: 10px; height: 20px; text-align: center; font-size: 12px; font-weight: 600; color: #34d399; transition: 0.2s; }
  .alert.err { color: #f87171; }

  blockquote {
    margin: 18px 0 0; border-left: 3px solid rgba(251,191,36,0.7);
    background: rgba(255,255,255,0.03); padding: 12px 16px; border-radius: 0 8px 8px 0;
  }
  blockquote p { margin: 0; font-size: 13px; font-style: italic; line-height: 1.6; color: #cbd5e1; }
  blockquote footer { margin-top: 4px; text-align: right; font-size: 11px; font-weight: 700; color: #fbbf24; }

  .footnote { margin-top: 16px; text-align: center; font-size: 11px; letter-spacing: 0.05em; color: #64748b; }

  @media (max-width: 420px) {
    .pw-display { font-size: 22px; padding: 14px 48px; }
  }
</style>
</head>

  function generatePassword() {
    const raw = WIN_WORDS[Math.floor(Math.random() * WIN_WORDS.length)];
    const base = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
    let result = base;
    while (result.length < 9) result += Math.floor(Math.random() * 10);
    return result;
  }

  let password = "";
  const userIdInput = document.getElementById('userId');
  const pwDisplay = document.getElementById('pwDisplay');
  const copyPwBtn = document.getElementById('copyPwBtn');
  const formattedArea = document.getElementById('formatted');
  const alertMsg = document.getElementById('alertMsg');
  const copyMsgBtn = document.getElementById('copyMsgBtn');

  function formatMessage() {
    if (!password) return "";
    return `Sudah kami bantu resetkan ya bosku, silakan di cek/dicoba login ya bosku.

User Id : ${userIdInput.value}
Password : ${password}

NB : mohon tidak memberikan password / PIN anda kepada orang lain dan jagalah kerahasiaan ID anda. segala bentuk kehilangan chip karena adanya permainan tidak dapat dikembalikan dengan alasan apapun. kami sarankan untuk melakukan pergantian password secara berkala ya bosku.

terima kasih`;
  }

  function refreshFormatted() {
    formattedArea.value = formatMessage();
  }
  userIdInput.addEventListener('input', refreshFormatted);

  document.getElementById('rollBtn').addEventListener('click', () => {
    password = generatePassword();
    pwDisplay.textContent = password;
    pwDisplay.classList.remove('empty');
    copyPwBtn.classList.add('show');
    copyPwBtn.classList.remove('copied');
    copyPwBtn.textContent = '📋';
    copyMsgBtn.classList.remove('done');
    copyMsgBtn.innerHTML = '📋 Salin Pesan';
    alertMsg.textContent = '';
    alertMsg.classList.remove('err');
    refreshFormatted();
  });

  copyPwBtn.addEventListener('click', async () => {
    if (!password) return;
    try {
      await navigator.clipboard.writeText(password);
      copyPwBtn.classList.add('copied');
      copyPwBtn.textContent = '✅';
      alertMsg.textContent = '🔑 Password berhasil disalin!';
      alertMsg.classList.remove('err');
      setTimeout(() => {
        copyPwBtn.classList.remove('copied');
        copyPwBtn.textContent = '📋';
        alertMsg.textContent = '';
      }, 1800);
    } catch {
      alertMsg.textContent = 'Gagal menyalin password.';
      alertMsg.classList.add('err');
    }
  });

  copyMsgBtn.addEventListener('click', async () => {
    const text = formatMessage();
    if (!text) {
      alertMsg.textContent = '🚨 Acak kode terlebih dahulu bosku!';
      alertMsg.classList.add('err');
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      alertMsg.textContent = '📋 Format teks berhasil disalin!';
      alertMsg.classList.remove('err');
      copyMsgBtn.classList.add('done');
      copyMsgBtn.innerHTML = '✅ Salin Pesan';
      setTimeout(() => { alertMsg.textContent = ''; }, 2200);
    } catch {
      alertMsg.textContent = 'Gagal menyalin.';
      alertMsg.classList.add('err');
    }
  });

  document.getElementById('themeBtn').addEventListener('click', function() {
    this.textContent = this.textContent === '☀️' ? '🌙' : '☀️';
  });
</script>

</body>
